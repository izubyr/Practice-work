<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess Master</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111319;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: #0b0e13;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        .btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 280px;
            margin: 20px auto;
        }

        input[type="number"] {
            padding: 12px;
            border-radius: 8px;
            background: #1d2025;
            color: white;
            border: 1px solid #464554;
            text-align: center;
            font-size: 1rem;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        #submitButton {
            background: #494bd6;
            color: white;
        }

        #restartButton {
            background: #93000a;
            color: white;
            display: none;
        }

        #comment {
            margin: 16px 0;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Guess A Number</h2>
        <p>Pick a number between 1 and 10.</p>

        <h3 id="comment">Enter your first guess</h3>

        <div class="btns">
            <input type="number" id="guessNumber" min="1" max="10" placeholder="Enter Number..." />
            <button id="submitButton">Submit</button>
            <button id="restartButton">Reset</button>
        </div>
    </div>

    <script>
        let secret = Math.floor(Math.random() * 10) + 1;
        let chances = 3;

        const hint = document.getElementById("comment");
        const input = document.getElementById("guessNumber");
        const submitButton = document.getElementById("submitButton");
        const restartButton = document.getElementById("restartButton");

        function endGame() {
            submitButton.disabled = true;
            input.disabled = true;
            restartButton.style.display = "block";
        }

        function resetGame() {
            secret = Math.floor(Math.random() * 10) + 1;
            chances = 3;
            input.value = "";
            hint.textContent = "Enter your first guess";
            submitButton.disabled = false;
            input.disabled = false;
            restartButton.style.display = "none";
            input.focus();
        }

        function handleGuess() {
            const guess = Number(input.value);

            if (!input.value || guess < 1 || guess > 10) {
                hint.textContent = "Enter a valid number from 1 to 10.";
                input.value = "";
                return;
            }

            if (guess === secret) {
                hint.textContent = "🎉 Correct! You guessed the number!";
                endGame();
                return;
            }

            chances -= 1;

            if (chances === 0) {
                hint.textContent = `💀 Game Over! The correct number was ${secret}.`;
                endGame();
                return;
            }

            const difference = Math.abs(secret - guess);

            if (guess < secret) {
                hint.textContent = difference <= 2
                    ? "Too low, but you're close!"
                    : "Too low! Try a bigger number.";
            } else {
                hint.textContent = difference <= 2
                    ? "Too high, but you're close!"
                    : "Too high! Try a smaller number.";
            }

            input.value = "";
            input.focus();
        }

        submitButton.addEventListener("click", handleGuess);

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                handleGuess();
            }
        });

        restartButton.addEventListener("click", resetGame);
    </script>
</body>
</html>
